server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: zeka-stack-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.31.5:3306/zeka-stack-helper?useUnicode=true&characterEncoding=utf8&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2b8
    username: root
    password: rootpassword

logging:
  level:
    root: INFO
    dev.dong4j.zeka.stack.api: DEBUG

app:
  proxy:
    enabled: ${APP_PROXY_ENABLED:true}
    host: ${APP_PROXY_HOST:192.168.31.4}
    port: ${APP_PROXY_PORT:6152}

zhipu:
  api:
    base-url: https://open.bigmodel.cn/api/paas/v4
    models-url: ${zhipu.api.base-url}/models
  # 兼容旧逻辑；推荐目录以 plugin.models 为准（2026-08 更新）
  default-models:
    - glm-5.2
    - glm-5.1
    - glm-5
    - glm-5-turbo
    - glm-4.7
    - glm-4.7-flash
    - glm-4.6
    - glm-4.5-air

# 插件推荐模型目录（与 AIProviderType.providerId 对齐；改此处部署即可，无需发插件版）
# 更新日期：2026-08-06（精选主力模型，非厂商全量）
plugin:
  models:
    providers:
      # Anthropic 官方 — https://platform.claude.com/docs/en/about-claude/models/overview
      anthropic:
        default-model: claude-sonnet-5
        models:
          - claude-opus-5
          - claude-sonnet-5
          - claude-opus-4-8
          - claude-opus-4-7
          - claude-opus-4-6
          - claude-sonnet-4-6
          - claude-haiku-4-5-20251001
      # DeepSeek — https://api-docs.deepseek.com/quick_start/pricing
      deepseek: &deepseek_models
        default-model: deepseek-v4-flash
        models:
          - deepseek-v4-pro
          - deepseek-v4-flash
      deepseek_anthropic: *deepseek_models
      # 豆包 / 火山方舟 Coding Plan（Seed 2.1 + 2.0）
      doubao: &doubao_models
        default-model: doubao-seed-2-1-pro-260628
        models:
          - doubao-seed-2-1-pro-260628
          - doubao-seed-2-1-turbo-260628
          - doubao-seed-2.0-pro
          - doubao-seed-2.0-lite
          - doubao-seed-2.0-mini
          - doubao-seed-2.0-code
      doubao_anthropic: *doubao_models
      # Moonshot / Kimi — https://platform.kimi.ai/
      moonshot: &moonshot_models
        default-model: kimi-k3
        models:
          - kimi-k3
          - kimi-k2.7-code
          - kimi-k2.6
          - kimi-k2.5
      moonshot_anthropic: *moonshot_models
      # 腾讯混元 / TokenHub（hy3；旧 hunyuan-2.0 已下线）
      hunyuan: &hunyuan_models
        default-model: hy3-preview
        models:
          - hy3-preview
          - hy3
          - hunyuan-role-latest
      hunyuan_anthropic: *hunyuan_models
      # 通义千问 / DashScope — https://help.aliyun.com/zh/model-studio/models
      qianwen:
        default-model: qwen3.5-plus
        models:
          - qwen3.8-max
          - qwen3.5-plus
          - qwen3.5-flash
          - qwen3-max
          - qwen3-235b-a22b
          - qwen3-32b
          - qwen3-14b
          - qwen3-8b
      # 智谱 GLM — https://docs.bigmodel.cn/cn/guide/start/model-overview
      glm: &glm_models
        default-model: glm-5.2
        models:
          - glm-5.2
          - glm-5.1
          - glm-5
          - glm-5-turbo
          - glm-4.7
          - glm-4.7-flash
          - glm-4.6
          - glm-4.5-air
      zhipu:
        alias-of: glm
      glm_anthropic: *glm_models
      # Z.AI（智谱海外）
      zai: &zai_models
        default-model: glm-5.2
        models:
          - glm-5.2
          - glm-5.1
          - glm-5
          - glm-5-turbo
          - glm-4.7
      zai_anthropic: *zai_models
      # ModelScope 推理（开源精选）
      modelscope: &modelscope_models
        default-model: ZhipuAI/GLM-4.7
        models:
          - ZhipuAI/GLM-4.7
          - GLM-4.7-Flash
          - Qwen/Qwen3-235B-A22B-Thinking-2507
          - Qwen/Qwen3-235B-A22B-Instruct-2507
          - deepseek-ai/DeepSeek-V3.2
          - moonshotai/Kimi-K2-Instruct
      modelscope_anthropic: *modelscope_models

github:
  token: ${ZEKA_STACK_PLUGIN_GITHUB_TOKEN:}
  repository-id: ${GITHUB_REPOSITORY_ID:R_kgDOO3uf9g}
  repository: ${GITHUB_REPOSITORY:zeka-stack/zeka-idea-plugin}
  category:
    general: ${GITHUB_CATEGORY_ID_GENERAL:DIC_kwDOO3uf9s4C0Jcg}
    ideas: ${GITHUB_CATEGORY_ID_IDEAS:DIC_kwDOO3uf9s4C0Jci}
    qa: ${GITHUB_CATEGORY_ID_QA:DIC_kwDOO3uf9s4C0Jch}
    announcements: ${GITHUB_CATEGORY_ID_ANNOUNCEMENTS:DIC_kwDOO3uf9s4C0Jcf}

oauth:
  github:
    client-id: ${ZEKA_STACK_GITHUB_CLIENT_ID:}
    client-secret: ${ZEKA_STACK_GITHUB_CLIENT_SECRET:}
    redirect-uri: ${ZEKA_STACK_GITHUB_REDIRECT_URI:https://zekastack.dong4j.site/api/oauth/github/callback}
    success-redirect: ${ZEKA_STACK_GITHUB_SUCCESS_REDIRECT:https://zekastack.dong4j.site/#/login}
    failure-redirect: ${ZEKA_STACK_GITHUB_FAILURE_REDIRECT:https://zekastack.dong4j.site/#/login}
    session-days: ${ZEKA_STACK_GITHUB_SESSION_DAYS:30}

monitor:
  nodes:
    # --- Root Nodes ---
    - id: engine
      name: Zeka Engine
      type: client
      host: 127.0.0.1
      check-type: ping
    - id: cloud
      name: Public Cloud
      type: cloud
      host: zekastack.dong4j.site
      check-type: ping
    # --- Homelab Gateways ---
    - id: proxy
      name: AI Proxy
      type: gateway
      group: homelab.gateways
      host: 2.0.0.1
      check-type: ping
    # --- Homelab Compute ---
    - id: mac-studio-m2ultra
      name: Mac Studio M2 Ultra
      type: compute
      group: homelab.compute
      host: 192.168.31.6
      check-type: ping
    - id: mac-m4
      name: Mac mini M4 Pro
      type: compute
      group: homelab.compute
      host: 192.168.31.5
      check-type: ping
    - id: mac-m2
      name: Mac mini M2
      type: compute
      group: homelab.compute
      host: 192.168.31.4
      check-type: ping
    - id: free-api
      name: Free API
      type: container
      group: homelab.compute
      host: 192.168.31.5
      port: 3000
      check-type: tcp
    # --- Sub Services (M2 Ultra) ---
    - id: cc-proxy-m2ultra
      name: CC Proxy
      type: service
      parent-id: mac-studio-m2ultra
      host: 192.168.31.6
      check-type: ping
    - id: lm-studio-m2ultra
      name: LM Studio
      type: service
      parent-id: mac-studio-m2ultra
      host: 192.168.31.6
      port: 1234
      check-type: tcp
    - id: ollama-m2ultra
      name: Ollama
      type: service
      parent-id: mac-studio-m2ultra
      host: 192.168.31.6
      port: 11434
      check-type: tcp
    # --- Sub Services (M4) ---
    - id: cc-proxy
      name: CC Proxy
      type: service
      parent-id: mac-m4
      host: 192.168.31.5
      port: 7890
      check-type: tcp
    - id: lm-studio
      name: LM Studio
      type: service
      parent-id: mac-m4
      host: 192.168.31.5
      port: 1234
      check-type: tcp
    - id: ollama-m4
      name: Ollama
      type: service
      parent-id: mac-m4
      host: 192.168.31.5
      port: 11434
      check-type: tcp
    # --- Sub Services (M2) ---
    - id: ollama-m2
      name: Ollama
      type: service
      parent-id: mac-m2
      host: 192.168.31.4
      port: 11434
      check-type: tcp
